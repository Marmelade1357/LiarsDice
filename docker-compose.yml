name: liarsdice

services:
  app:
    build: .
    environment:
      - TZ=Europe/Berlin
    ports:
      # Nur intern auf dem Pi erreichbar (127.0.0.1:8102) - der Spielehub-nginx routet
      # games.oualid.de/liarsdice/ hierher. Port 8102 gewählt, weil 8080/8081 und
      # 8092-8101 schon von anderen Projekten (Widerstand, Wizard, Spielehub, Bluff,
      # Tempel, Poker, Munchkin, Monopoly, Uno, Eiserner Thron ...) belegt sind.
      - "127.0.0.1:8102:3000"
    restart: unless-stopped
